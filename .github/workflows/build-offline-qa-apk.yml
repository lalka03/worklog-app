name: Worklog Offline QA APK (separate install)

on:
  push:
    branches: [worklog-android-offline-qa]

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/worklog-android-offline-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Client and package-isolation tests
        run: npm test

  release:
    if: github.ref == 'refs/heads/worklog-android-offline-qa'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare strictly scoped web assets
        env:
          WORKLOG_API_BASE_URL: ${{ vars.WORKLOG_API_BASE_URL }}
        run: node scripts/stage-pilot-assets.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Install Capacitor dependencies
        run: npm install
      - name: Apply isolated Android identity
        run: cp capacitor.offline-qa.config.json capacitor.config.json
      - name: Generate separate Android project
        run: npx cap add android
      - name: Install QA-native protected session bridge
        run: node scripts/stage-offline-qa-android.cjs
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/worklog-release.p12
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              defaultConfig {
                  versionCode Integer.valueOf(System.getenv("VERSION_CODE") ?: "1")
              }
          }
          GRADLE
      - name: Sync web assets
        run: npx cap sync android
      - name: Build signed offline QA APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/worklog-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify Android package identity and signing
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk \
            | grep -F "package: name='com.worklog.app.yandex.offlineqa'"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          sha256sum android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorklogOfflineQA-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
