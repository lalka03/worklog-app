name: Worklog Cache Protection Release Candidate (tests only)

on:
  push:
    branches: [worklog-cache-protection-rc-20261123]

permissions:
  contents: read

concurrency:
  group: worklog-cache-protection-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.ref == 'refs/heads/worklog-cache-protection-rc-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated candidate and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm production identity and auth files are byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object api.js)" = "9e8673f1614d2f1ba9d323f3b1aef06a0519ecf0"
          test "$(git hash-object account.js)" = "10ff04c87a3e482ddc35cac88673d3bfe527de6a"
          node -e 'const c=require("./capacitor.config.json");if(c.appId!=="com.worklog.app.yandex.test")process.exit(1)'
          git diff --exit-code d73eee4d55076362b6d914a12de9ea875e0cba32 HEAD -- api.js account.js capacitor.config.json native android
          echo 'RELEASE_CANDIDATE_IDENTITY_AND_AUTH_UNCHANGED'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend packages
        run: python -m pip install -r backend/requirements.txt
      - name: Backend memory-only regression
        run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Client regression and old-cache upgrade scenarios
        run: npm test
