⚠️ Файл workflow нужно положить в папку
GitHub запускает сборку только из папки .github/workflows/. Если ты загрузил build-apk.yml просто в корень — он не сработает. Но есть лёгкий трюк: переместим его прямо в браузере, отредактировав имя файла.

Шаг 1. Перемести файл и вставь код
Открой репозиторий (включи «Версия для ПК»).
Нажми на файл build-apk.yml в списке.
Нажми карандаш ✏️ (значок редактирования) в правом верхнем углу.
Вверху будет поле с именем файла build-apk.yml. Сотри его и вставь это имя целиком:
.github/workflows/build-apk.yml
Внизу в большом поле удали всё и вставь этот код полностью:
name: Build Android APK

on:
workflow_dispatch:
push:
branches: [ main ]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Node
uses: actions/setup-node@v4
with:
node-version: 20

- name: Setup Java
uses: actions/setup-java@2v4
with:
distribution: temurin
java-version: 17

- name: Setup Android SDK
uses: android-actions/setup-android@v3

- name: Accept Android licenses
run: yes | sdkmanager --licenses || true>/dev/null || true

- name: Add Android platform
run: npx cap add android

- name: Sync web assets
run: npx cap sync android

- name: Build debug APK
run: |
cd android
chmod +x gradтыйlew
./gradlew assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: WorklogApp-debug
path: android/app/build/outputs/apk/debug/app-debug.apk
П **рокру
name: Install Capacitor run: npm install @capacitor/core @capacitor/cli @capacitor/android

name: Prepare web assets run: | mkdir -p www cp index.html www/index.html cp data.json www/dataдела.json ти вниз → зелёная «Commit changes» → «Commit directly to the main branch» → Commit changes.

Шаг 2. Запусти сборку
Вверху репозитория нажми вкладку «Actions».
Слева в списке выбери «Build Android APK».
Нажми «Run workflow» → зелёная «Run workflow».
Сборка займёт 3–7 минут. Будешь видеть жёл кружок (идёт сборка), потом зелёная галочка ✅.

Шаг 3. Скачай APK
Когда появится ✅:

Зайди в этот запуск (workflow run).
Прокрути вниз до блока«Artifacts»**.
Скачай WorklogApp-debug — это архив с APK внутри.
Распакуй и установи app-debug.apk на телефон (разреши установку из неизвестных источников).
Сй Шаг 1 и напиши, когда файл переименован в .github/workflows/build-apk.yml. Потом запустим сборку вместе. 👍

