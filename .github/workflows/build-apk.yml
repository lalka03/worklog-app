Понял, в чём дело. Кнопка «Build Android APK» в разделе Actions появляется только если файл лежит строго в папке .github/workflows/. Если ты загрузил build-apk.yml просто в корень — GitHub его не видит, поэтому и в Actions ничего нет.

Сейчас сделаем проще и надёжнее — создадим файл сразу в правильной папке.

Шаг 1. Удали старый файл (необязательно)
Если в списке файлов репозитория видишь build-apk.yml в корне — зайди в него, нажми три точки ⋯ → Delete file → Commit changes. Но это можно и позже.

Шаг 2. Создай файл сразу в правильной папке
Включи «Версию для ПК» (три точки ⋮ в Chrome).
Нажми «Add file» → «Create new file».
В поле с именем файла (там серым написано Name your file...) сотри всё и вставь точно это:
.github/workflows/build-apk.yml
