name: Worklog Yandex Test

on:
  workflow_dispatch:
  push:
    branches: [ worklog-yandex-test ]

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/worklog-yandex-test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run client tests
        run: npm test

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/worklog-yandex-test'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web assets
        env:
          WORKLOG_API_BASE_URL: ${{ vars.WORKLOG_API_BASE_URL }}
        run: node scripts/stage-pilot-assets.cjs

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/worklog-release.p12
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
              defaultConfig {
                  versionCode Integer.valueOf(System.getenv("VERSION_CODE") ?: "1")
              }
          }
          EOF

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/worklog-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorklogYandexTest-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

