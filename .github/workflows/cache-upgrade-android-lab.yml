name: Worklog synthetic Android in-place upgrade acceptance (QA only)

on:
  push:
    branches: [worklog-cache-upgrade-lab-20261123]

permissions:
  contents: read

jobs:
  android-upgrade-lab:
    if: github.ref == 'refs/heads/worklog-cache-upgrade-lab-20261123'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse d73eee4d55076362b6d914a12de9ea875e0cba32:account.js)" = '10ff04c87a3e482ddc35cac88673d3bfe527de6a'
          test "$(git rev-parse d73eee4d55076362b6d914a12de9ea875e0cba32:sync.js)" = 'af88fc8452b6a469765b4a8b7a8e191fff5744ee'
          test "$(git rev-parse 90929964399b6dcf9eb26e6a2cf0779663348ed0:sync.js)" = '4e46042d50a5490b288effacdf05ae3b0392fcdf'
          test "$(git rev-parse d73eee4d55076362b6d914a12de9ea875e0cba32:api.js)" = '9e8673f1614d2f1ba9d323f3b1aef06a0519ecf0'
          git diff --exit-code d73eee4d55076362b6d914a12de9ea875e0cba32 90929964399b6dcf9eb26e6a2cf0779663348ed0 -- account.js api.js capacitor.config.json native
          ! grep -E 'WORKLOG_API_BASE_URL|fetch\(' scripts/cache-upgrade-lab.js
          echo 'ANDROID_UPGRADE_QA_SOURCE_ISOLATED'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build disposable old and candidate debug APKs, using pinned source
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          npm install --no-audit --no-fund
          node scripts/stage-cache-upgrade-lab.cjs old
          npx cap add android
          QA_DIR=android/app/src/main/java/com/worklog/app/yandex/upgradeqa
          test -f "$QA_DIR/MainActivity.java"
          cp lab-native/*.java "$QA_DIR/"
          npx cap sync android
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 1/' android/app/build.gradle
          (cd android && chmod +x gradlew && ./gradlew assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/worklog-upgrade-v1.apk
          node scripts/stage-cache-upgrade-lab.cjs new
          npx cap sync android
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/' android/app/build.gradle
          (cd android && ./gradlew assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/worklog-upgrade-v2.apk
          for v in 1 2; do
            apk="/tmp/worklog-upgrade-v$v.apk"
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.worklog.app.yandex.upgradeqa' versionCode='$v'"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          done
          echo 'ANDROID_UPGRADE_TWO_QA_APKS_READY'
      - name: Verify WebView localStorage and Android Keystore after actual in-place emulator update
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-cache-upgrade-emulator.sh
